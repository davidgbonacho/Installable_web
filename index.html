<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA installable</title>
    <link rel="manifest" href="/Installable_web/manifest.json">
    <meta name="theme-color" content="#3b5daa">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/Installable_web/img/logo144.png">

    <meta http-equiv='cache-control' content='no-cache'>
    <meta http-equiv='expires' content='0'>
    <meta http-equiv='pragma' content='no-cache'>

    <style>
        @import url(https://fonts.googleapis.com/css?family=Oswald:300);

        * {
            font-family: Oswald;
            font-size: 30px;
            color: white;
        }

        .centro {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>

<body style="margin: 0;">
    <div style="background-color:  rgb(34, 142, 209); width: 100vw; height: 100vh;">

        <div class="centro">
            This is my installable APP 
        </div>

    </div>
</body>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/Installable_web/sw.js')
      .catch((err) => console.error('SW registration failed:', err));
  }
</script>
</html>
